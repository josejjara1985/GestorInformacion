services:
  - type: web
    name: GestorInformacion
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Bogota
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: SESSION_SECRET
        generateValue: true
      - key: BACKUP_KEY
        generateValue: true
    disk:
      name: gestor-data
      mountPath: /opt/render/project/src/data
      sizeGB: 2
