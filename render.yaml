services:
  - type: web
    name: GestorInformacion
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Bogota
      - key: SESSION_SECRET
        generateValue: true
      - key: BACKUP_KEY
        generateValue: true