services:
  gestor:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      TZ: America/Bogota
      SESSION_SECRET: ${SESSION_SECRET:-cambiar-en-produccion}
      BACKUP_KEY: ${BACKUP_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - gestor-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  gestor-data:
